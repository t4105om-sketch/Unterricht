const BEREICHE = [

      ],

    referat:{

      ],

        "Welche Barrieren hat unser Körper, und wie schützen sie jeweils vor Erregern?",

      leitfragen:[
        "Welche Zellen gehören zur spezifischen Abwehr? Stelle Fresszelle, T-Helferzelle, B-Zelle/Plasmazelle, Killer-T-Zelle und Gedächtniszelle mit ihrer Aufgabe vor.",

/* Die erste Antwort ist jeweils die richtige – die Reihenfolge wird beim Start gemischt. */
const FRAGEN = [
  /* ---------- A: Bakterien und Viren ---------- */
  {b:"A", f:"Welche Aussage trifft auf Bakterien zu, aber NICHT auf Viren?",
   o:["Sie besitzen eigene Ribosomen und haben einen eigenen Stoffwechsel.","Sie enthalten Erbgut.","Sie können Krankheiten auslösen.","Sie tragen Proteine an ihrer Oberfläche."],

  {b:"A", f:"Wie vermehren sich Viren?",
   o:["Nur in einer Wirtszelle: Die Zelle stellt nach dem Bauplan des Virus neue Viren her.","Durch Zweiteilung, unter günstigen Bedingungen etwa alle 20 Minuten.","Durch Sporen, die über die Luft verbreitet werden.","Sie teilen sich selbstständig im Blut."],
   e:"Viren haben keinen eigenen Stoffwechsel. Sie schleusen ihr Erbgut in eine Wirtszelle ein, die dann mit ihren eigenen Ribosomen neue Viren baut. Zweiteilung ist typisch für Bakterien."},
  {b:"A", f:"Joghurtbakterien konntet ihr im Lichtmikroskop sehen, Grippeviren dagegen nicht. Warum?",
   o:["Viren sind 10- bis 100-mal kleiner als Bakterien und nur im Elektronenmikroskop sichtbar.","Viren sind durchsichtig, Bakterien nicht.","Viren bewegen sich zu schnell, um sie scharfzustellen.","Viren sind nur sichtbar, solange sie in einer Zelle stecken."],
   e:"Viren sind nur 20 bis 300 nm groß, Bakterien meist 1 bis 10 µm. Für Viren reicht die Auflösung des Lichtmikroskops nicht aus."},
  {b:"A", f:"Was sind Plasmide?",
   o:["Kleine DNA-Ringe von Bakterien, auf denen oft Resistenzgene liegen und die Bakterien austauschen können.","Die Proteinhülle, die das Erbgut eines Virus schützt.","Der Zellkern einer Bakterienzelle.","Kurze Fortsätze, mit denen sich Bakterien an Oberflächen heften."],
   e:"Plasmide sind zusätzliche, kleine DNA-Ringe. Bakterien haben keinen Zellkern; die kurzen Fortsätze heißen Pili."},
  {b:"A", f:"Wie heftet sich ein Coronavirus an Zellen der Atemwege?",

   e:"Die Spike-Proteine in der Virushülle passen genau zu bestimmten Rezeptoren. Geißel, Pili und Zellwand besitzen nur Bakterien."},
  {b:"A", f:"Welche dieser Krankheiten wird von Bakterien ausgelöst?",

   e:"Grippe (Influenzaviren), Windpocken (Varizella-Zoster-Virus) und Erkältungen (z. B. Rhinoviren) sind Viruserkrankungen – wie in der „Notaufnahme“."},

  /* ---------- B: Antibiotika und Resistenzen ---------- */
  {b:"B", f:"Wie wirkt das Antibiotikum Penicillin?",
   o:["Es verhindert, dass Bakterien ihre Zellwand aufbauen.","Es zerstört das Erbgut von Viren.","Es macht die Fresszellen stärker.","Es senkt das Fieber und lindert so die Krankheit."],
   e:"Penicillin greift den Aufbau der bakteriellen Zellwand an. Andere Antibiotika blockieren die Ribosomen der Bakterien."},
  {b:"B", f:"Warum schaden Antibiotika unseren eigenen Körperzellen kaum?",
   o:["Unsere Zellen haben keine Zellwand wie Bakterien und andere Ribosomen.","Unsere Zellen sind größer und deshalb widerstandsfähiger.","Das Immunsystem schützt unsere Zellen vor dem Antibiotikum.","Antibiotika wirken nur im Darm, nicht im übrigen Körper."],
   e:"Antibiotika greifen Strukturen an, die es nur bei Bakterien gibt (Zellwand) oder die dort anders gebaut sind (Ribosomen)."},
  {b:"B", f:"Lenas Mutter möchte gegen Lenas Grippe ein Antibiotikum. Warum hilft es nicht?",

   e:"Viren sind keine Zellen. Ohne Zellwand, Ribosomen und Stoffwechsel gibt es nichts, was ein Antibiotikum angreifen könnte. Mit Resistenz hat das nichts zu tun."},

   e:"Mutationen entstehen zufällig bei der Zweiteilung. Das Antibiotikum verursacht die Resistenz nicht, es sortiert nur aus (Selektion). Auch nicht der Mensch, sondern das Bakterium ist resistent."},
  {b:"B", f:"Was versteht man unter Selektion bei Antibiotikaresistenz?",
   o:["Das Antibiotikum tötet die empfindlichen Bakterien; die resistenten überleben und vermehren sich.","Ärztinnen und Ärzte wählen das passende Antibiotikum aus.","Bakterien suchen sich gezielt einen Wirt ohne Antibiotika.","Resistente Bakterien töten die empfindlichen Bakterien ab."],
   e:"Selektion bedeutet Auslese: Unter Antibiotikum haben resistente Bakterien plötzlich Platz und Nährstoffe und vermehren sich – ihr Anteil steigt."},
  {b:"B", f:"Herr D. hat seine Antibiotika-Tabletten nach drei Tagen abgesetzt, weil es ihm besser ging. Warum ist das problematisch?",

   e:"Wird zu früh abgesetzt, überleben gerade die Bakterien, die am wenigsten empfindlich sind. Resistent wird nicht der Körper, sondern die Bakterien."},

  /* ---------- C: Unspezifische Abwehr ---------- */
  {b:"C", f:"Was kennzeichnet die unspezifische Abwehr?",

  {b:"C", f:"In welcher Reihenfolge läuft die Phagozytose ab?",

   ===================================================================== */
const aktiveBereiche = BEREICHE.filter(b => b.aktiv);
const aktivIds = aktiveBereiche.map(b => b.id);
const bereichVon = id => BEREICHE.find(b => b.id === id);
const app = document.getElementById("app");
let S = null;   // Zustand

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function mischen(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function speichern(){try{localStorage.setItem(CONFIG.speicherSchluessel,JSON.stringify(S));}catch(e){}}
function laden(){try{const x=localStorage.getItem(CONFIG.speicherSchluessel);return x?JSON.parse(x):null;}catch(e){return null;}}
function loeschen(){try{localStorage.removeItem(CONFIG.speicherSchluessel);}catch(e){}}
function kopf(){return `<p class="kicker">${esc(CONFIG.kicker)}</p>`;}

/* ---------- Startseite ---------- */
function start(){
  const n = FRAGEN.filter(q=>aktivIds.includes(q.b)).length;
  app.innerHTML = `${kopf()}
    <h1>${esc(CONFIG.titel)}</h1>
    <p class="unter">${esc(CONFIG.untertitel)}</p>
    <div class="info"><b class="k">So funktioniert es</b>
      Du beantwortest ${n} Fragen zur ganzen Reihe – von Bakterien und Viren bis zur spezifischen Abwehr.
      Zu jeder Frage gibt es genau <b>eine</b> richtige Antwort. Am Ende siehst du, wie gut du in den
      ${aktiveBereiche.length} Themenbereichen bist. <b>In deinem schwächsten Bereich hältst du ein Referat</b> –
      so wirst du dort zur Expertin oder zum Experten für die Klasse.
    </div>
    <p>Bearbeite den Test allein und ohne Hilfsmittel. Nur dann bekommst du das Thema, bei dem du am meisten dazulernst.
    Du brauchst etwa 20 Minuten.</p>
    <label class="feld" for="nm">Dein Name</label>
    <input type="text" id="nm" autocomplete="off" placeholder="Vorname Nachname">
    <label class="feld" for="kl">Klasse</label>
    <input type="text" id="kl" autocomplete="off" placeholder="z. B. 10d">
    <div class="hinweis" id="hw"></div>
    <div class="leiste"><span></span><button class="btn" id="go">Test starten</button></div>
    <p class="fussnote">Die Themenbereiche werden erst am Ende angezeigt. Deine Antworten werden nur auf diesem Gerät zwischengespeichert.</p>`;
  document.getElementById("go").onclick = ()=>{
    const name = document.getElementById("nm").value.trim();
    const klasse = document.getElementById("kl").value.trim();
    if(name.length<2){document.getElementById("hw").textContent="Bitte gib deinen Namen ein.";return;}
    const fr = mischen(FRAGEN.map((q,i)=>i).filter(i=>aktivIds.includes(FRAGEN[i].b)));
    S = { name, klasse, start:Date.now(), reihenfolge:fr,
          optionen: fr.map(i=>mischen(FRAGEN[i].o.map((_,k)=>k))),
          antworten: fr.map(()=>null), pos:0, fertig:false, gewaehlt:null };
    speichern(); frage();
  };
}

/* ---------- Fragenseite ---------- */
function frage(){
  const N = S.reihenfolge.length, p = S.pos, q = FRAGEN[S.reihenfolge[p]];
  const opts = S.optionen[p];
  const beantw = S.antworten.filter(a=>a!==null).length;
  app.innerHTML = `${kopf()}
    <div class="fnr">Frage ${p+1} von ${N}  ·  ${beantw} beantwortet</div>
    <div class="fortschritt"><span style="width:${(beantw/N*100).toFixed(1)}%"></span></div>
    ${q.svg?diagramm():""}
    <div class="frage">${esc(q.f)}</div>
    <div id="opts">${opts.map((k,i)=>`<button class="opt${S.antworten[p]===k?" sel":""}" data-k="${k}">
        <span class="bu">${"ABCD"[i]}</span><span>${esc(q.o[k])}</span></button>`).join("")}</div>
    <div class="leiste">
      <button class="btn zweit" id="zur" ${p===0?"disabled":""}>Zurück</button>
      ${p<N-1?`<button class="btn" id="wei">Weiter</button>`:`<button class="btn" id="abg">Test abgeben</button>`}
    </div>
    <div class="punkte noprint" aria-label="Fragenübersicht">${S.reihenfolge.map((_,i)=>
      `<button data-i="${i}" class="${S.antworten[i]!==null?"ok":""}${i===p?" akt":""}">${i+1}</button>`).join("")}</div>
    <div class="hinweis" id="hw"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    S.antworten[p]=+b.dataset.k; speichern();
    app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));
    app.querySelector(`.punkte button[data-i="${p}"]`).classList.add("ok");
  });
  document.getElementById("zur").onclick=()=>{S.pos--;speichern();frage();};
  const w=document.getElementById("wei"); if(w) w.onclick=()=>{S.pos++;speichern();frage();};
  const a=document.getElementById("abg"); if(a) a.onclick=abgeben;
  app.querySelectorAll(".punkte button").forEach(b=>b.onclick=()=>{S.pos=+b.dataset.i;speichern();frage();});
  window.scrollTo(0,0);
}

function abgeben(){
  const offen = S.antworten.map((a,i)=>a===null?i+1:null).filter(x=>x);
  if(offen.length){
    const ok = confirm(`Du hast ${offen.length} Frage(n) noch nicht beantwortet (Nr. ${offen.join(", ")}).\nUnbeantwortete Fragen zählen als falsch. Trotzdem abgeben?`);
    if(!ok) return;
  } else if(!confirm("Test jetzt abgeben? Danach kannst du nichts mehr ändern.")) return;
  S.fertig=true; S.ende=Date.now(); speichern(); ergebnis();
}

/* ---------- Auswertung ---------- */
function auswerten(){
  const w = {}; aktivIds.forEach(id=>w[id]={r:0,n:0});
  S.reihenfolge.forEach((fi,p)=>{const q=FRAGEN[fi]; w[q.b].n++; if(S.antworten[p]===0) w[q.b].r++;});
  aktivIds.forEach(id=>w[id].pz=w[id].n?Math.round(w[id].r/w[id].n*100):0);
  const minPz = Math.min(...aktivIds.map(id=>w[id].pz));
  const schwach = aktivIds.filter(id=>w[id].pz===minPz);
  const gesamtR = aktivIds.reduce((s,id)=>s+w[id].r,0), gesamtN = aktivIds.reduce((s,id)=>s+w[id].n,0);
  return {w,schwach,gesamtR,gesamtN};
}

function datum(ts){const d=new Date(ts);return d.toLocaleDateString("de-DE")+", "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr";}

function ergebnis(){
  const A = auswerten();
  if(!S.gewaehlt && A.schwach.length===1){S.gewaehlt=A.schwach[0]; speichern();}
  const balken = aktiveBereiche.map(b=>{
    const x=A.w[b.id];
    return `<div class="bzeile${A.schwach.includes(b.id)?" schwach":""}">
      <div class="bname">${esc(b.name)}</div><div class="bwert">${x.r}/${x.n}</div>
      <div class="bspur"><span style="width:${x.pz}%"></span></div></div>`;
  }).join("");

  let teil2 = "";
  if(!S.gewaehlt){
    const alleGleich = A.schwach.length===aktivIds.length;
    teil2 = `<h2>Wähle dein Referatthema</h2>
      <p>${alleGleich?"Du hast in allen Bereichen gleich viele Punkte erreicht. Wähle einen Bereich, in dem du dich am unsichersten fühlst."
        :"Du hast in mehreren Bereichen gleich wenige Punkte. Wähle einen davon – am besten den, in dem du dich selbst am unsichersten fühlst."}</p>
      <div class="wahl">${A.schwach.map(id=>`<button class="opt" data-id="${id}"><span class="bu">${id}</span><span><b>${esc(bereichVon(id).name)}</b><br>${esc(bereichVon(id).referat.titel)}</span></button>`).join("")}</div>
      <p class="klein">Die Wahl kann danach nicht mehr geändert werden.</p>`;
  } else {
    teil2 = referatTeil(S.gewaehlt, A);
  }

  app.innerHTML = `${kopf()}
    <h1>Dein Ergebnis</h1>
    <p class="unter">${esc(S.name)}${S.klasse?" · "+esc(S.klasse):""} · ${A.gesamtR} von ${A.gesamtN} Punkten</p>
    <h2>Deine Themenbereiche</h2>
    <div class="balken">${balken}</div>
    ${teil2}
    <h2>Deine Antworten im Überblick</h2>
    <p>Hier siehst du zu jedem Bereich, welche Fragen du falsch beantwortet hast – mit Erklärung. Das ist auch ein guter Startpunkt für dein Referat.</p>
    ${rueckblick(A)}
    <div class="leiste noprint">
      <button class="linkbtn" id="rs">Test zurücksetzen (nur mit Code der Lehrkraft)</button>
    </div>`;

  app.querySelectorAll(".wahl .opt").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(!confirm(`Referatthema „${bereichVon(id).name}“ verbindlich wählen?`)) return;
    S.gewaehlt=id; speichern(); ergebnis();
  });
  const kb=document.getElementById("kopie"); if(kb) kb.onclick=kopieren;
  const pb=document.getElementById("druck"); if(pb) pb.onclick=()=>window.print();
  document.getElementById("rs").onclick=()=>{
    const c=prompt("Code der Lehrkraft eingeben, um den Test zurückzusetzen:");
    if(c===null) return;
    if(c.trim()===CONFIG.resetCode){loeschen();S=null;start();window.scrollTo(0,0);} else alert("Der Code ist nicht richtig.");
  };
  window.scrollTo(0,0);
}

function referatTeil(id, A){
  const b = bereichVon(id), r = b.referat, x = A.w[id];
  return `<div class="thema"><div class="k">Dein Referatthema · Bereich ${esc(b.name)}</div>
      <div class="t">${esc(r.titel)}</div></div>
    ${CONFIG.abgabe?`<p><b>Termin:</b> ${esc(CONFIG.abgabe)}</p>`:""}
    <h3>Diese Leitfragen beantwortest du in deinem Referat</h3>
    <ol>${r.leitfragen.map(l=>`<li>${esc(l)}</li>`).join("")}</ol>
    <div class="hilfe"><b class="k">Tipp</b>${esc(r.tipp)}</div>
    <h3>Anforderungen</h3>
    <ul>${CONFIG.referat.anforderungen.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
    <h3>Darauf achte ich bei der Bewertung</h3>
    <table class="krit"><tr><th>Kriterium</th><th>Das bedeutet</th></tr>
      ${CONFIG.referat.kriterien.map(k=>`<tr><td><b>${esc(k[0])}</b></td><td>${esc(k[1])}</td></tr>`).join("")}</table>
    <div class="beleg" id="beleg"><div class="k">Ergebnisbeleg</div>
      <table>
        <tr><td>Name</td><td><b>${esc(S.name)}</b></td></tr>
        ${S.klasse?`<tr><td>Klasse</td><td>${esc(S.klasse)}</td></tr>`:""}
        <tr><td>Abgegeben</td><td>${datum(S.ende||Date.now())}</td></tr>
        ${aktiveBereiche.map(bb=>`<tr><td>${esc(bb.name)}</td><td>${A.w[bb.id].r}/${A.w[bb.id].n}</td></tr>`).join("")}
        <tr><td><b>Gesamt</b></td><td><b>${A.gesamtR}/${A.gesamtN}</b></td></tr>
        <tr><td><b>Referatthema</b></td><td><b>${esc(r.titel)}</b></td></tr>
      </table>
    </div>
    <p class="noprint"><b>Wichtig:</b> Mache einen Screenshot vom Ergebnisbeleg oder kopiere dein Ergebnis und schicke es deiner Lehrkraft.</p>
    <div class="leiste noprint" style="justify-content:flex-start">
      <button class="btn" id="kopie">Ergebnis kopieren</button>
      <button class="btn zweit" id="druck">Drucken / als PDF</button>
    </div>
    <div class="hinweis" id="hw"></div>`;
}

function ergebnisText(){
  const A=auswerten(), r=bereichVon(S.gewaehlt).referat;
  return [`Diagnosetest Immunbiologie – Ergebnis`,
    `Name: ${S.name}${S.klasse?" ("+S.klasse+")":""}`,
    `Abgegeben: ${datum(S.ende||Date.now())}`,
    ...aktiveBereiche.map(b=>`${b.name}: ${A.w[b.id].r}/${A.w[b.id].n}`),
    `Gesamt: ${A.gesamtR}/${A.gesamtN}`,
    `Referatthema: ${r.titel}`].join("\n");
}
function kopieren(){
  const t=ergebnisText(), hw=document.getElementById("hw");
  const fertig=()=>{hw.textContent="Ergebnis kopiert – du kannst es jetzt z. B. in eine Nachricht einfügen.";};
  const alt=()=>{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99999);
    try{document.execCommand("copy");fertig();}catch(e){hw.textContent="Kopieren hat nicht geklappt – bitte mache einen Screenshot.";}
    document.body.removeChild(ta);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(fertig,alt);} else alt();
}

function rueckblick(A){
  return aktiveBereiche.map(b=>{
    const eintraege = S.reihenfolge.map((fi,p)=>({q:FRAGEN[fi],a:S.antworten[p],nr:p+1})).filter(e=>e.q.b===b.id);
    const falsch = eintraege.filter(e=>e.a!==0);
    return `<details${b.id===S.gewaehlt?" open":""}><summary>${esc(b.name)} – ${A.w[b.id].r}/${A.w[b.id].n} richtig</summary>
      ${falsch.length?falsch.map(e=>`<div class="rv">
        <div class="q">Frage ${e.nr}: ${esc(e.q.f)}</div>
        <div class="a"><span class="zeichen">✗</span>Deine Antwort: ${e.a===null?"<i>nicht beantwortet</i>":esc(e.q.o[e.a])}</div>
        <div class="a"><span class="zeichen">✓</span><b>Richtig: ${esc(e.q.o[0])}</b></div>
        <div class="a klein">${esc(e.q.e)}</div></div>`).join("")
        :`<div class="rv">Alle Fragen in diesem Bereich richtig.</div>`}
    </details>`;
  }).join("");
}

/* ---------- Start ---------- */
(function init(){
  const g = laden();
  if(g && g.reihenfolge && g.reihenfolge.every(i=>FRAGEN[i] && aktivIds.includes(FRAGEN[i].b))){
    S=g; if(S.fertig) ergebnis(); else frage();
  } else { if(g) loeschen(); start(); }
})();
</script>
</body>
